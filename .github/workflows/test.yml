name: test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26
      - name: Get dependencies
        run: go get -v -t -d ./...
      - name: Test
        run: go test -v ./...